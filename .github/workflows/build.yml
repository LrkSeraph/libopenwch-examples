# Build every example in libopenwch-examples.
#
# Two jobs, because the examples can break in two different ways:
#
#   pinned — against the libopenwch commit the submodule names, which is what
#            a person cloning this repository actually gets.  This is the job
#            that fails when the examples and the pinned library disagree.
#   master — against libopenwch's current master, which is how a library change
#            that breaks applications is noticed here rather than in somebody's
#            project.  The library moves without this repository changing, so
#            this one also runs on a schedule.

name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

env:
  LIBOPENWCH_REF: master

jobs:
  pinned:
    name: pinned submodule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A developer's absolute path in a committed file is a small leak that is
      # invisible in code review, and these repositories are public.  Cheap to
      # check here; expensive to discover later in the history.
      - name: No local paths or credentials in tracked files
        run: |
          fail=0
          if git grep -n -I -E '/home/[a-z]+/|/Users/[A-Za-z]+/|C:\\Users' -- . ; then
            echo "::error::a tracked file contains an absolute path from a developer's machine"
            fail=1
          fi
          if git grep -n -I -E 'BEGIN [A-Z ]*PRIVATE KEY|password[[:space:]]*=|api[_-]?key[[:space:]]*=|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' -- . ; then
            echo "::error::a tracked file looks like it contains a credential"
            fail=1
          fi
          if [ "$fail" != 0 ]; then exit 1; fi
          echo "no local paths or credentials in tracked files"

      - name: Install the RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Report the toolchain and the library revision
        run: |
          riscv64-unknown-elf-gcc --version | head -1
          git -C libopenwch rev-parse --short HEAD

      # The library archives are not in the submodule, so this first build goes
      # through the rules' on-demand library build -- the same path a fresh
      # clone takes.  Building it once up front also keeps the example failures
      # below attributable to the example.
      - name: Build the library
        run: make -C libopenwch

      - name: Every example, with the default lookup
        run: |
          for d in examples/*/; do
            echo "== $d"
            make -C "$d" || exit 1
            make -C "$d" clean
          done

      # Debian's toolchain ships no newlib at all, so this is the sharpest
      # available check that the examples are genuinely freestanding.
      - name: Freestanding examples
        run: |
          for d in examples/blink examples/ch582_blink; do
            make -C "$d" LIBOPENWCH_NOSTDLIB=1 || exit 1
            make -C "$d" clean
          done

      - name: The Bluetooth LE example
        run: |
          make -C examples/ch582_ble_advertise || exit 1
          make -C examples/ch582_ble_advertise clean

  master:
    name: current library master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Check out libopenwch master into a temporary directory
        run: |
          git clone --depth 1 --branch "$LIBOPENWCH_REF" \
            https://github.com/LrkSeraph/libopenwch.git "$RUNNER_TEMP/libopenwch"
          git -C "$RUNNER_TEMP/libopenwch" rev-parse --short HEAD

      # OPENWCH_DIR is named explicitly here, so the rules build that checkout
      # on demand instead of the submodule: the submodule is not fetched in
      # this job at all.
      - name: Every example, against master
        run: |
          for d in examples/*/; do
            echo "== $d"
            make -C "$d" OPENWCH_DIR="$RUNNER_TEMP/libopenwch" || exit 1
            make -C "$d" OPENWCH_DIR="$RUNNER_TEMP/libopenwch" clean
          done
